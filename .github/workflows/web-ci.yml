# =============================================================================
# Web · CI — browser end-to-end flows against a live API and a seeded database
#
# The SPA had NO workflow of its own. Its typecheck/lint run inside the backend
# build and `codegen:check` lives in Backend · CI, but nothing ever opened a
# browser: every screen was unverified above the API boundary, so a broken auth
# bootstrap, a form that posts the wrong shape, or a list that never re-fetches
# shipped green.
#
# This job boots Postgres + Valkey, migrates and seeds, starts the API on 3001,
# then runs Playwright — whose config starts the Vite dev server itself and
# proxies /v1 to the API, exactly as local development does.
# =============================================================================
name: Web · CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # NOT `edited`, matching Backend · CI. With `cancel-in-progress` below, editing a PR
    # title or body would cancel the in-flight real run and replace it with one that
    # skipped everything — and GitHub counts a skipped required check as passing, so the
    # PR would go green having executed nothing. Every run here is a real one.
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # pull @qnsc-vn/* from GitHub Packages

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.2'

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opshub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Authenticates pnpm against GitHub Packages for @qnsc-vn/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Shared by migrate/seed and the API process. Connects as the owner rather than the
      # restricted role: Backend · CI already proves the least-privilege grants are complete,
      # and repeating that here would only add a second way for this job to fail.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable
      VALKEY_URL: redis://localhost:6379
      # The BFF session lives in Valkey, so the cache is NOT optional here — a run without it
      # would log in successfully and then lose the session on the next request.
      JWT_ISSUER: opshub-api
      JWT_AUDIENCE: opshub-web
      JWT_ACCESS_EXPIRY: 8h
      JWT_REFRESH_EXPIRY_DAYS: '7'
      COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok
      CSRF_SECRET: ci-test-csrf-secret-min-32-characters-okay
      CORS_ORIGINS: http://localhost:5173
      # 3001, because apps/web/vite.config.ts proxies /v1 there. A different port here means
      # every request 502s through the proxy and every spec fails on its first assertion.
      PORT: '3001'
      # `POST /v1/bff/dev-login` is refused under NODE_ENV=production by design, and it is how
      # global-setup signs in — OpsHub's login page is a single Entra SSO button, and CI has no
      # Entra tenant.
      NODE_ENV: test
      LOG_LEVEL: warn
      OTEL_ENABLED: 'false'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: QNSC-VN/qnsc-ci/actions/setup-node-pnpm@v1.6.6
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Generate ephemeral JWT keypair
        # Fresh EC P-256 keypair per run — never a static secret, matching Backend · CI.
        # JWT_PUBLIC_KEY is derived from the private key at boot, so only the private one is
        # strictly required; both are exported to keep the two workflows readable side by side.
        run: |
          node - << 'EOF'
          const { generateKeyPairSync } = require('crypto');
          const fs = require('fs');
          const { privateKey, publicKey } = generateKeyPairSync('ec', {
            namedCurve: 'P-256',
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            publicKeyEncoding:  { type: 'spki',  format: 'pem' },
          });
          fs.appendFileSync(process.env.GITHUB_ENV, `JWT_PRIVATE_KEY=${Buffer.from(privateKey).toString('base64')}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `JWT_PUBLIC_KEY=${Buffer.from(publicKey).toString('base64')}\n`);
          console.log('JWT keypair generated');
          EOF

      # `pnpm db:migrate` always ensures the RBAC catalogue, but the login-able DEMO EMPLOYEES
      # are fixtures behind `SEED_ON_DEPLOY` — and `admin@opshub.local`, the principal
      # global-setup signs in as, is one of them. Without this the migrate step succeeds and
      # dev-login then answers `401 AUTH_INVALID_CREDENTIALS: No active account exists for this
      # email`, which is what the first run of this workflow did.
      #
      # Safe here, and it has to be explicit: `db/migrate.ts` refuses the fixtures whenever
      # `NODE_ENV=production`, which only deployed migrator tasks set. Backend · CI needs no
      # equivalent because its e2e globalSetup resets and seeds the database itself.
      - name: Migrate + seed database
        run: pnpm db:migrate
        env:
          SEED_ON_DEPLOY: 'true'

      - name: Build API
        run: pnpm build:api

      - name: Start API (background)
        run: |
          node --enable-source-maps dist/apps/api/apps/api/src/main.js > /tmp/api.log 2>&1 &
          echo "Waiting for API health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/v1/healthz >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat /tmp/api.log; exit 1

      - name: Install Playwright browser
        run: pnpm --filter opshub-web exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: pnpm --filter opshub-web exec playwright test --reporter=line

      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

      # The API log is the only place a 500 behind a failed assertion is visible: Playwright
      # reports "element not found", not why the request failed.
      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log || true
