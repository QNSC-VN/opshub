# =============================================================================
# CI — fast quality gates on every PR and push to main
# Gate: lint → typecheck → build → pr-title
# Security scans live in the Security · Scan workflow — independently runnable.
# =============================================================================
name: Web · CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # NOT `edited`. That action exists only for the PR-title check, which now lives in
    # pr-title.yml — and listening for it here was actively harmful: combined with
    # `cancel-in-progress: true` below and the `if: action != 'edited'` guards this workflow
    # used to carry, editing a PR title or body CANCELLED the in-flight real run and replaced
    # it with one where every heavy job skipped. GitHub counts a skipped required check as
    # passing, so the PR went green having executed nothing. Every run of this workflow is now
    # a real one.
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # required by amannn/action-semantic-pull-request
  packages: read       # pull @qnsc-vn/* from GitHub Packages

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.2'

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: QNSC-VN/qnsc-ci/actions/setup-node-pnpm@v1.6.6
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # pull @qnsc-vn/* from GitHub Packages

      - name: Lint
        run: pnpm --filter opshub-web lint

      - name: Typecheck
        run: pnpm --filter opshub-web typecheck

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Unit tests (no DB — pure component/hook/util tests)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_tests: ${{ steps.detect.outputs.has_tests }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: QNSC-VN/qnsc-ci/actions/setup-node-pnpm@v1.6.6
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # pull @qnsc-vn/* from GitHub Packages

      - name: Detect unit tests
        id: detect
        shell: bash
        run: |
          if find apps/web/src -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests (with coverage)
        if: steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter opshub-web test:cov

      - name: Skip empty test suite
        if: steps.detect.outputs.has_tests != 'true'
        run: echo "No unit test files found. Skipping Vitest coverage job."

      - name: Upload coverage
        if: always() && steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: QNSC-VN/qnsc-ci/actions/setup-node-pnpm@v1.6.6
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # pull @qnsc-vn/* from GitHub Packages

      - name: Build
        run: pnpm --filter opshub-web build
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: apps/web/dist/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # 4. PR title — enforce Conventional Commits format on PR titles.
  #    Required because release-please derives CHANGELOG from PR titles.
